name: Publicar Voltz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: voltz-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.VOLTZ_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Build GitHub Pages
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

      - name: Build MidiaHost
        if: ${{ env.FTP_PASSWORD != '' }}
        run: VOLTZ_BASE=/ npm run build
      - name: Publicar por FTPS
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.midiahost.pt
          username: "Voltz@voltz.midiahost.pt"
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: subD/Voltz/
      - name: MidiaHost ainda não configurado
        if: ${{ env.FTP_PASSWORD == '' }}
        run: echo "GitHub Pages publicado. MidiaHost fica pendente até existir o secret VOLTZ_FTP_PASSWORD."
