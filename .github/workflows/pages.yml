name: Publicar Voltz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltz-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.VOLTZ_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Publicar por FTPS
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.midiahost.pt
          username: "Voltz@voltz.midiahost.pt"
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: subD/Voltz/
      - name: Avisar se faltar password FTPS
        if: ${{ env.FTP_PASSWORD == '' }}
        run: |
          echo "Build concluído, mas o deploy foi ignorado porque o secret VOLTZ_FTP_PASSWORD ainda não está configurado."
