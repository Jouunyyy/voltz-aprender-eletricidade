name: Publicar Voltz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: voltz-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.VOLTZ_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build GitHub Pages
        run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Build MidiaHost
        if: ${{ env.FTP_PASSWORD != '' }}
        run: VOLTZ_BASE=/ npm run build
      - name: Publicar por FTPS
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ftp.midiahost.pt
          username: "Voltz@voltz.midiahost.pt"
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: subD/Voltz/
      - name: MidiaHost ainda não configurado
        if: ${{ env.FTP_PASSWORD == '' }}
        run: echo "GitHub Pages publicado. MidiaHost fica pendente até existir o secret VOLTZ_FTP_PASSWORD."
